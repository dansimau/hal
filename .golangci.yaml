version: "2"
linters:
  default: all
  disable:
    - bodyclose
    - cyclop
    - depguard
    - exhaustruct
    - funlen
    - gochecknoinits
    - gocognit
    - godox
    - nonamedreturns
    - wrapcheck
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    tagliatelle:
      case:
        rules:
          json: snake
    varnamelen:
      max-distance: 12
      min-name-length: 2
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: (.+)\.go$
        text: block should not end with a whitespace
      - path: (.+)\.go$
        text: usage of time.Local
    paths:
      - third_party$
      - builtin$
      - examples$
severity:
  default: info
  rules:
    - linters:
        - funlen
        - gocognit
        - godox
        - nestif
      severity: info
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
